:root{
  --ink:#F2F0EA; --paper:#080808; --sand:#0F0F0F; --card:#161616; --line:rgba(255,255,255,.12); --mute:rgba(242,240,234,.45);
  --court:#2DA84F; --coral:#F26B5B; --turf:#2DA84F; --green-deep:#1A6B3A; --bronze:#C98B4A; --silver:#B7BFC9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gotham Narrow","Arial Narrow",Arial,sans-serif;font-size:15px;line-height:1.5;font-weight:700;-webkit-font-smoothing:antialiased}
.eyebrow{display:block;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--turf);margin-bottom:12px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink)}
.brand img{height:26px;width:auto}
.brand span{padding-left:12px;border-left:1px solid var(--line);line-height:1}
.crumb{color:var(--mute);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;text-decoration:none}
.crumb:hover{color:var(--ink)}

/* league index */
.hero{padding:56px 0 32px}
.hero h1{font-size:clamp(48px,8vw,96px);font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:.92;max-width:14ch}
.hero p{color:var(--ink);margin-top:18px;max-width:52ch;line-height:1.9;font-size:15px}
.league-list{display:grid;gap:14px;padding-bottom:64px}
.league-card{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:26px 28px;border:1px solid var(--line);text-decoration:none;background:var(--card)}
.league-card:hover{border-color:rgba(45,168,79,.5)}
.league-card img{height:72px;width:auto}
.lhead .logo{height:120px;width:auto;margin-bottom:14px;display:block}
.league-card h2{font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1.05}
.league-card .meta{color:var(--mute);font-size:11px;letter-spacing:1px;margin-top:8px}
.pill{display:inline-block;padding:6px 10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--line);color:var(--mute);background:rgba(0,0,0,.55);border-radius:2px}
.pill.live{color:var(--turf);border-color:rgba(45,168,79,.5)}
.pill.soon{color:var(--ink);border-color:rgba(255,255,255,.3)}
.pill.done{background:var(--line)}

/* league page */
.lhead{padding:36px 0 0}
.lhead h1{font-size:clamp(30px,5vw,56px);font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1;max-width:22ch}
.lhead .sub{color:var(--mute);margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:20px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.facts b{color:var(--ink);font-weight:700}
nav.tabs{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);margin-top:24px;z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{padding:18px 14px;text-decoration:none;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mute);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a.on{color:var(--ink);border-color:var(--turf)}
main{padding:28px 0 80px;min-height:60vh}
h2.sec{font-size:34px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;line-height:1}
.note{font-size:12px;color:var(--mute);margin-top:12px;letter-spacing:.3px}
.note a{color:var(--turf)}

/* division switch */
.divswitch{display:inline-flex;border:1px solid var(--line);padding:0;margin-bottom:22px}
.divswitch button{padding:12px 22px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.divswitch button.on{background:var(--ink);color:#080808}
.divswitch button.on[data-div="Bronze"]{background:var(--bronze);color:#080808}
.divswitch button.on[data-div="Silver"]{background:var(--silver);color:#080808}

/* overview */
.divgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.divbox{border:1px solid var(--line);padding:20px 22px;border-top:6px solid var(--bronze)}
.divbox.Silver{border-top-color:var(--silver)}
.divbox h3{font-size:22px;font-weight:700}
.divbox .range{color:var(--mute);font-size:14px}
.divbox ul{list-style:none;padding:0;margin-top:12px;font-size:15px}
.divbox li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.divbox li span:last-child{color:var(--mute);font-size:13px}
.next{margin-top:28px}

/* teams */
.teams{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.teams li{border:1px solid var(--line);background:var(--card)}
.teams li a{display:block;padding:18px;text-decoration:none}
.teams li:hover{border-color:rgba(45,168,79,.5)}
.teams li b{display:block;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.teams li span{color:var(--mute);font-size:12px;letter-spacing:.5px}

/* fixtures */
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:0 0 auto;min-width:84px;padding:12px 14px;border:1px solid var(--line);text-align:left;line-height:1.15}
.weeks button b{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.weeks button span{font-size:17px;letter-spacing:.5px}
.weeks button.on{background:var(--ink);border-color:var(--ink);color:#080808}
.weeks button.on b{color:rgba(8,8,8,.6)}
.weeks button.final{border-style:dashed}
.grid{display:grid;grid-template-columns:70px 1fr 1fr;border:1px solid var(--line)}
.grid>div{padding:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:60px}
.grid>div:nth-child(3n){border-right:0}
.grid .h{background:var(--sand);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;min-height:0;padding:12px}
.grid .t{font-size:12px;color:var(--mute);background:var(--sand);letter-spacing:1px}
.card{display:block;width:100%;text-align:left;padding:0;background:var(--card);border:1px solid transparent;overflow:hidden}
.card .row{display:grid;grid-template-columns:1fr repeat(3,28px);gap:6px;align-items:center;padding:11px 16px;font-size:15px;letter-spacing:.3px;color:var(--mute);border-bottom:1px solid var(--line)}
.card .row.win{color:var(--ink);font-weight:700}
.card .row .s{text-align:center;font-variant-numeric:tabular-nums}
.card .foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 16px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.card .foot .st{margin-left:auto}
.card .foot .st.final{color:var(--turf)}
.card .foot .st.live{color:var(--coral)}
.card .foot .div.Bronze{color:var(--bronze)}
.card .foot .div.Silver{color:var(--silver)}
.card:hover{border-color:rgba(45,168,79,.5)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid .card{border-radius:0}
.empty{color:var(--mute);padding:20px 0;font-size:13px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.grid>div{border-right:0}.grid .h:first-child,.grid .t{display:none}.grid .h.c{background:var(--ink);color:var(--paper)}}

/* standings */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:14px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:700;color:var(--mute);font-size:9px;letter-spacing:2.5px;text-transform:uppercase}
th:nth-child(2),td:nth-child(2){text-align:left;width:40%;text-transform:uppercase;letter-spacing:1px}
td:first-child{color:var(--mute);width:32px}
td.pts{font-weight:700;color:var(--turf);font-size:17px}
tbody tr{cursor:pointer}
tbody tr:nth-child(4) td{border-bottom:2px solid rgba(45,168,79,.6)}tbody tr:hover td{background:var(--sand)}
.tblwrap{overflow-x:auto}

/* pair page */
.pairhead{margin-bottom:22px}
.pairhead h2{font-size:clamp(30px,5vw,52px);font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1}
.pairhead p{color:var(--mute);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}
.pairhead .rec{display:flex;gap:28px;margin-top:16px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.pairhead .rec b{display:block;font-size:26px;color:var(--ink);letter-spacing:0}
h3.grp{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--turf);margin:26px 0 12px}
/* calendar buttons */
.cal{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cal a,.cal button{display:inline-block;padding:11px 16px;border:1px solid rgba(255,255,255,.2);font-size:10px;letter-spacing:3px;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.cal .pri{background:var(--green-deep);border-color:var(--green-deep)}
.cal a:hover,.cal button:hover{border-color:var(--turf)}
/* rescheduled */
.card.resch{border-color:rgba(242,107,91,.6)}
.rband{background:var(--coral);color:#180a08;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:7px 16px}
.rband.big{font-size:12px;letter-spacing:1.5px;padding:12px 14px;margin:0 0 16px}
.card .foot .st.resch{color:var(--coral)}
.moved{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.moved h3{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
.moved p{font-size:13px;color:var(--mute);margin-bottom:12px}
/* prize */
.prize{margin:0 0 18px;padding:14px 18px;border:1px solid rgba(45,168,79,.5);background:var(--card);font-size:14px;line-height:1.6}
.prize small{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--turf);margin-bottom:4px}
/* sponsors */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin-top:22px;padding:14px 0;border-top:1px solid var(--line)}
.strip span{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.strip a{display:flex;align-items:center;height:34px;text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);opacity:.85}
.strip a:hover{opacity:1}
.strip img{height:34px;width:auto;max-width:150px;object-fit:contain}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sp{display:block;border:1px solid var(--line);background:var(--card);padding:22px;text-decoration:none}
.sp:hover{border-color:rgba(45,168,79,.5)}
.splogo{height:64px;display:flex;align-items:center;margin-bottom:16px}
.splogo img{max-height:72px;max-width:180px;object-fit:contain}
.splogo img.ext{background:#fff;padding:6px}
.splogo span{font-size:20px;letter-spacing:2px;text-transform:uppercase}
.sp b{display:block;font-size:16px;letter-spacing:1.5px;text-transform:uppercase}
.sp em{display:block;font-style:normal;font-size:11px;letter-spacing:1px;color:var(--turf);text-transform:uppercase;margin-top:4px}
.sp p{font-size:13px;line-height:1.7;color:rgba(242,240,234,.75);margin-top:10px}
.benefit{margin-top:14px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--turf);font-size:13px}
.benefit small{display:block;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
/* rules */
.rules{max-width:66ch}
.rules h3{font-size:22px;letter-spacing:2px;text-transform:uppercase;margin:26px 0 6px}
.rules p{margin-bottom:8px;line-height:1.85;color:rgba(242,240,234,.85)}

/* contact */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:760px}
.contact div{border:1px solid var(--line);background:var(--card);padding:22px 22px}
.contact b{display:block;margin-bottom:6px;letter-spacing:2px;text-transform:uppercase;font-size:14px}
.contact p{font-size:13px;color:rgba(242,240,234,.75);line-height:1.7}
.contact a{color:var(--turf)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal.open{display:flex}
.sheet{background:var(--card);border:1px solid rgba(29,107,58,.4);width:100%;max-width:520px;padding:26px 24px calc(28px + env(safe-area-inset-bottom,0px));border-radius:0;max-height:88vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center;padding:20px}}
.sheet .tag{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--turf)}
.sheet h3{font-size:26px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.05;margin:10px 0 18px}
.sets{display:flex;gap:8px;margin-bottom:14px}
.sets div{flex:1;border:1px solid var(--line);padding:10px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.sets div small{display:block;font-weight:700;color:var(--mute);font-size:12px}
.pair{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.pair.win{font-weight:700}
.comments{margin-top:16px;background:var(--paper);padding:14px 16px;border-left:4px solid var(--coral)}
.comments b{display:block;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
.comments{font-weight:700;font-size:14px;line-height:1.7}
.close{margin-top:20px;width:100%;padding:14px;border:1px solid rgba(255,255,255,.2);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.close:hover{background:var(--ink);color:#080808}
.status{font-size:13px;color:var(--mute);padding:8px 0}
.err{background:#3a1f1c;color:#ffb3aa;padding:12px 16px;border-left:4px solid var(--coral);margin-bottom:16px}
</style>
</head>

/* ============ SHEET LOADER ============ */
async function loadTab(tab){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  const r = await fetch(url); if(!r.ok) throw new Error(`${tab}: HTTP ${r.status}`);
  return parseCSV(await r.text()).map(o=>{if(o.time&&/^\d:\d\d/.test(o.time))o.time="0"+o.time;if(o.week!==undefined)o.week=String(parseInt(o.week)||o.week);return o;});
}
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true; else if(c==','){row.push(cell);cell="";}
    else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!='\r') cell+=c; }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim()!=="")).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}

function parseSets(m){ return [m.set1,m.set2,m.set3].filter(Boolean).map(s=>s.split("-").map(Number)).filter(a=>a.length==2&&!a.some(isNaN)); }
function outcome(m){
  const st=(m.status||"").toLowerCase();
  if(st=="forfeit"||st=="walkover"){ const w=(m.winner||"").trim(); return w?{done:true,winner:w,home:w==m.home_team_id?"W":"F",away:w==m.away_team_id?"W":"F",hs:0,as:0,hg:0,ag:0,forfeit:true}:null; }
  const sets=parseSets(m); if(!sets.length) return null;
  let hs=0,as=0,hg=0,ag=0; sets.forEach(([h,a])=>{ if(h>a) hs++; else if(a>h) as++; hg+=h; ag+=a; });
  if(hs<2&&as<2) return {done:false,hs,as,hg,ag};
  return {done:true,winner:hs>as?m.home_team_id:m.away_team_id,hs,as,hg,ag};
}
function pointsFor(o,isHome){
  if(!o||!o.done) return [0,0];
  if(o.forfeit) return o.winner==(isHome?"home":"away")?[0,0]:[0,0];
  const my=isHome?o.hs:o.as, th=isHome?o.as:o.hs;
  return [CONFIG.POINTS[`${my}-${th}`]??0, my>th?1:0];
}
function standings(div){
  const rows={}; DB.teams.filter(t=>t.division==div).forEach(t=>rows[t.team_id]={t:{...t,team_name:teamName(t)},p:0,w:0,l:0,pts:0,sf:0,sa:0,gf:0,ga:0});
  DB.matches.filter(m=>m.division==div).forEach(m=>{ const o=outcome(m); if(!o||!o.done) return;
    const H=rows[m.home_team_id],A=rows[m.away_team_id]; if(!H||!A) return;
    H.p++;A.p++;
    if(o.forfeit){ const w=rows[o.winner]; const l=w===H?A:H; w.w++; l.l++; w.pts+=CONFIG.POINTS["2-0"]; w.sf+=2; l.sa+=2; return; }
    H.sf+=o.hs;H.sa+=o.as;H.gf+=o.hg;H.ga+=o.ag; A.sf+=o.as;A.sa+=o.hs;A.gf+=o.ag;A.ga+=o.hg;
    H.pts+=CONFIG.POINTS[`${o.hs}-${o.as}`]??0; A.pts+=CONFIG.POINTS[`${o.as}-${o.hs}`]??0;
    if(o.hs>o.as){H.w++;A.l++;}else{A.w++;H.l++;} });
  return Object.values(rows).sort((a,b)=>b.pts-a.pts||(b.sf-b.sa)-(a.sf-a.sa)||(b.gf-b.ga)-(a.gf-a.ga)||a.t.team_name.localeCompare(b.t.team_name));
}

  const resch=/resched/i.test(m.status)&&!o?.done;
  return `<button class="card ${resch?"resch":""}" onclick="openMatch('${esc(m.match_id)}')">${resch?`<div class="rband">Rescheduled | new date ${fmtDate(m.date)} ${esc(m.time)} ${esc(m.court)}</div>`:""}
    <div class="${rowc(m.home_team_id)}"><span>${esc(h.team_name)}</span>${o?.forfeit?`<span class="s">${o.winner==m.home_team_id?"W":"F"}</span><span class="s"></span><span class="s"></span>`:cols(0)}</div>
    <div class="${rowc(m.away_team_id)}"><span>${esc(a.team_name)}</span>${o?.forfeit?`<span class="s">${o.winner==m.away_team_id?"W":"F"}</span><span class="s"></span><span class="s"></span>`:cols(1)}</div>
    <div class="foot"><span class="div ${esc(m.division)}">${esc(m.division).toUpperCase()}</span><span>W${esc(m.week)}</span><span>${fmtDate(m.date)} ${esc(m.time)} ${esc(m.court)}</span>${m.comments.trim()?'<span class="cmt" style="color:var(--coral)">NOTES</span>':""}<span class="st ${st[0]}">● ${st[1]}</span></div></button>`;
}
function openMatch(id){
  const m=DB.matches.find(x=>x.match_id==id); if(!m) return;
  const h=teamById(m.home_team_id),a=teamById(m.away_team_id),o=outcome(m),sets=parseSets(m);
  $("#sheet").innerHTML=`<div class="tag">${esc(m.division)} | Week ${esc(m.week)} | ${fmtDate(m.date)} ${esc(m.time)} | ${esc(m.court)}</div>${/resched/i.test(m.status)&&!o?.done?`<div class="rband big">Rescheduled. Originally Week ${esc(m.week)}, now ${fmtDate(m.date)} at ${esc(m.time)}, ${esc(m.court)}.</div>`:""}
    <h3>${esc(h.team_name)} vs ${esc(a.team_name)}</h3>
    ${o?.forfeit?`<p>Walkover. ${esc(teamById(o.winner).team_name)} take the match.</p>`:sets.length?`<div class="sets">${sets.map((s,i)=>`<div><small>Set ${i+1}</small>${s[0]}-${s[1]}</div>`).join("")}</div>
    <div class="pair ${o?.winner==m.home_team_id?"win":""}"><span>${esc(h.team_name)}</span><span>${o?.hs??""} sets</span></div><div class="pair ${o?.winner==m.away_team_id?"win":""}"><span>${esc(a.team_name)}</span><span>${o?.as??""} sets</span></div>`:`<p>Not played yet.</p>`}
    ${m.comments.trim()?`<div class="comments"><b>Match notes</b>${esc(m.comments)}</div>`:""}
    ${o?.done?"":`<div class="cal"><a class="pri" href="${esc(gcalUrl(m,DB.leagues.find(l=>l.league_id==m.league_id)))}" target="_blank" rel="noopener">Google Calendar</a><button onclick="downloadIcs('','${esc(m.league_id)}','${esc(m.match_id)}')">Apple / Outlook</button></div>`}
    <button class="close" onclick="closeMatch()">Close</button>`;
  $("#modal").classList.add("open");
}
function closeMatch(){$("#modal").classList.remove("open");}
$("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeMatch();});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeMatch();});
boot();
</script>
</body>
</html>
